name: trax_sim
description: >
  Pretend trip members for bench tests: through a companion radio on a
  serial port or Bluetooth, each sends its location to the trip channel the
  way MeshTrax does in TRAX mode, while walking a trail or driving a road.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  bluez: ^0.8.3
  traxshare:
    path: ../../packages/traxshare

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.8
