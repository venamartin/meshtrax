name: traxpix_litert
description: >
  The model runtime for traxpix: LiteRT 2.3.0 compiled models for the AEIC
  graphs (the send and receive sides of the entropy layer, and the decoder
  that rebuilds the picture) and the safety classifier, through LiteRT's C
  API, owned by one long-lived worker isolate.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.50.0"

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  traxpix:
    path: ../traxpix

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.meshtrax.traxpix_litert
        pluginClass: TraxpixLitertPlugin
      ios:
        pluginClass: TraxpixLitertPlugin
      macos:
        pluginClass: TraxpixLitertPlugin
