name: traxheard
description: >
  Asks an observer server whether a channel message this radio sent was
  heard, so MeshTrax doesn't send it again for nothing. Pure Dart.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  crypto: ^3.0.3
  http: ^1.2.0
  pointycastle: ^4.0.0

dev_dependencies:
  fake_async: ^1.3.1
  lints: ^5.0.0
  test: ^1.25.8
