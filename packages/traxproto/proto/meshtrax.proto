// What MeshTrax phones send each other, in every format that grows.
//
// The rules all format owners agreed (2026-11-27):
// - A field number is never used again and never changes its meaning or
//   type. What grows takes a new number. Readers skip numbers they do not
//   know.
// - Only varint, 64-bit, length-delimited and 32-bit fields (wire types 0,
//   1, 2 and 5). No groups.
// - Nothing is required: a reader copes with any field missing.
// - A `bytes` field with a layout of its own is described here, and a
//   change to that layout takes a new field number.
// - A packet is never encoded again by anyone who passes it on.
//
// MeshTrax's data types, the one list of them (the block 0x0170 to 0x017F,
// meshcore-dev/MeshCore#3925):
//   0x0170  photos as MeshTrax 1.12.0 sent them; retired
//   0x0171  TRAX            TraxReportGrowth, TraxAskGrowth below
//   0x0172  photos          docs/technical/photos.md
//   0x0173  requests        docs/technical/channel-requests.md
//   0x0174  kept for replies to requests; not built
//   0x0175  direct message  DirectMessage below
//   0x0176  its answer      DirectAck below
//   0x0177 to 0x017F  free
syntax = "proto3";

package meshtrax;

// How a text is packed.
enum TextPacking {
  // UTF-8 as typed.
  TEXT_PLAIN = 0;
  // Smaz over the UTF-8 bytes (lib/helpers/smaz.dart), used when smaller.
  TEXT_SMAZ = 1;
}

// A direct message between two MeshTrax phones: data type 0x0175, sealed
// with the two radios' shared secret. Before these bytes comes one fixed
// byte: the version in the top 3 bits (0), then the side bit (1 when the
// sender's key sorts above the receiver's), then 4 spare bits (0).
message DirectMessage {
  // The sender's count of messages to this contact. The same for every try
  // of one message, so the tries are one message to the receiver.
  uint32 number = 1;

  // 0 for the first try. It changes the sealed bytes, without which a
  // repeater that carried one try drops the next as a packet it has seen.
  uint32 try = 2;

  // Seconds since 1970 by the sender's clock, when the message was written.
  fixed32 time = 3;

  // The repeaters this try was sent along, first one first, `code_bytes`
  // each. Empty on a flood, whose path is in the packet as it arrives.
  bytes route = 4;

  // Repeaters the sender hears where it is now, the best first. For each:
  // its code (`code_bytes`), then one byte, the level in whole dB plus 128.
  bytes hears = 5;

  // Repeaters known to hear the sender where it is now, the best first, in
  // the layout of `hears`; a level byte of 0 says the level is not known.
  bytes heard_by = 6;

  // Bytes in a repeater code in the fields above. 0 means 2.
  uint32 code_bytes = 7;

  TextPacking packing = 8;

  // The text, packed as `packing` says.
  bytes text = 9;
}

// The answer to a DirectMessage: data type 0x0176, sealed the same way,
// after the same fixed byte.
message DirectAck {
  // The message it answers, and the try whose copy was opened.
  uint32 number = 1;
  uint32 try = 2;

  // Every try of that message that has arrived so far: bit n for try n.
  uint32 tries_arrived = 3;

  // The repeaters the opened copy had passed, first one first.
  bytes came_by = 4;

  // The level the opened copy was heard at, in whole dB.
  sint32 level = 5;

  // The repeaters this answer was sent along, first one first. Empty on a
  // flood.
  bytes route = 6;

  // As in DirectMessage, for the phone that answers.
  bytes hears = 7;
  bytes heard_by = 8;
  uint32 code_bytes = 9;
}

// TRAX: data type 0x0171, on a trip's private channel, what a member's
// MeshTrax sends in TRAX mode (docs/technical/trax-mode.md). Every packet
// from version 2 on starts with the same 9 bytes: byte 0 is the version << 4
// | the kind, bytes 1 to 4 the first 4 bytes of the sender's key, bytes 5 to
// 8 when it was sent, in seconds since 1970. Of a later version, a reader
// reads only these, to say whose location it can't show. This is version
// 2. Each kind's fixed bytes follow, then its message below; a
// message that doesn't parse drops the packet. Every number is
// little-endian.

// After a REPORT's (kind 1) fixed bytes 9 to 22: flags (bit 0 moving, bit 1
// still, bit 2 may be an old position; bits 3 to 7 spare), latitude and
// longitude in 2^24ths of their range (u24 each, from -90 and -180), seq,
// heading in 256ths of a turn, speed in 0.5 m/s while moving or minutes
// still, altitude in metres (i16, -32768 not known), the radio's battery in
// % (255 not known), the icon.
message TraxReportGrowth {
  // The sender's radio name: UTF-8, at most 20 bytes, cut at a character.
  // In the first report, then every 30 minutes.
  string name = 1;

  // The sender's app build, beside the name.
  uint32 build = 2;

  // Pieces of the sender's track, newest first: 3 bytes (the grid in metres,
  // the hours a piece is kept, the number of pieces), 5 a piece (the low 16
  // bits of its first point's minute since 1970, the latest at or before the
  // report's minute + 2 with them; its span in minutes, u16; its number of
  // points), then every point, each piece's newest first, as a step east then
  // north from the point before (the first from the report's position) in
  // grid units: zigzag, then exp-Golomb of order 3, most significant bit
  // first, zero bits to the end of the byte.
  bytes track = 3;
}

// After an ASK's (kind 2) fixed bytes from 9: flags (all 8 spare), the first
// 4 bytes of the key of the member asked, the number of their track's pieces
// the asker holds, then each one's minute (its low 16 bits, u16). Nothing in
// it yet.
message TraxAskGrowth {}
