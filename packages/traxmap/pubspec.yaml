name: traxmap
description: Offline vector maps for MeshTrax, rendered from PMTiles packs. No screens; hooks and data for the app.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: ">=3.40.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  path: ^1.9.1
  flutter_map: ^8.3.2
  # 2.11.x, checked with test/renderer_check_test.dart. The app's pubspec.lock
  # isn't committed, so builds take the newest version allowed: run that
  # check on a new minor version before allowing it.
  flutter_map_vector_tiles: ">=2.11.0 <2.12.0"
  # MeshTrax pins ^0.9.1; flutter_map 8.3 and flutter_map_vector_tiles accept both.
  latlong2: ">=0.9.1 <0.11.0"
  # One minor version at a time: see MeshTrax's pubspec.
  material_ui: ">=1.11.0 <1.12.0"
  meta: ^1.16.0
  background_downloader: ^9.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/sprites/
    - assets/styles/
    - assets/world/
