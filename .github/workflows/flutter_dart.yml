name: Flutter and Dart

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings

      # The formatting gate is deliberately absent: 63 files in the repo do not
      # satisfy `dart format`, so it has never once run to completion — the
      # analyze step above always failed first. Reinstating it means a
      # formatting-only commit across those files; until someone chooses to do
      # that, a permanently red check is worse than no check.

      - name: Run tests
        run: flutter test -r github

      # The report inbox is a Cloudflare Worker, tested with Node's own runner.
      - name: Test the report inbox
        working-directory: tools/report-inbox
        run: node --test test/*.test.js

      # The path_graph package is pure Dart with its own pubspec — the
      # app's analyze/test above never touch it.
      - name: Analyze path_graph package
        working-directory: packages/path_graph
        run: |
          dart pub get
          dart analyze --fatal-infos --fatal-warnings

      - name: Test path_graph package
        working-directory: packages/path_graph
        run: dart test -r github

      # Offline routing, points of interest, coordinates, line of sight, the
      # observer check, TRAX locations and routes on the water: pure Dart,
      # each with its own pubspec. Tests that need local routing data skip
      # here.
      - name: Analyze and test traxroute, traxpoi, traxcoords, traxlos, traxheard, traxshare and traxwater
        run: |
          for p in traxroute traxpoi traxcoords traxlos traxheard traxshare traxwater; do
            (cd packages/$p && dart pub get && dart analyze --fatal-infos --fatal-warnings && dart test -r github) || exit 1
          done

      # The TRAX simulator for bench tests: pure Dart, its own pubspec.
      - name: Analyze and test the TRAX simulator
        working-directory: tool/trax_sim
        run: |
          dart pub get
          dart analyze --fatal-infos --fatal-warnings
          dart test -r github

      # The traxmap package (offline vector maps) is a Flutter package with
      # its own pubspec. Its real-pack tests skip here: the test packs aren't
      # in git (see packages/traxmap/README.md).
      - name: Analyze traxmap package
        working-directory: packages/traxmap
        run: |
          flutter pub get
          flutter analyze --fatal-infos --fatal-warnings

      - name: Test traxmap package
        working-directory: packages/traxmap
        run: flutter test -r github

      # Photo packets: pure Dart, its own pubspec.
      - name: Analyze and test traxpix
        working-directory: packages/traxpix
        run: |
          dart pub get
          dart analyze --fatal-infos --fatal-warnings
          dart test -r github

      # The photo model's runtime is a Flutter package with its own pubspec.
      # The model itself isn't in git, so its reference tests skip here.
      - name: Analyze and test traxpix_litert package
        working-directory: packages/traxpix_litert
        run: |
          flutter pub get
          flutter analyze --fatal-infos --fatal-warnings
          flutter test -r github
