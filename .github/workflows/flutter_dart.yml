name: Flutter and Dart

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings

      # The formatting gate is deliberately absent: 63 files in the repo do not
      # satisfy `dart format`, so it has never once run to completion — the
      # analyze step above always failed first. Reinstating it means a
      # formatting-only commit across those files; until someone chooses to do
      # that, a permanently red check is worse than no check.

      - name: Run tests
        run: flutter test -r github

      # The path_graph package is pure Dart with its own pubspec — the
      # app's analyze/test above never touch it.
      - name: Analyze path_graph package
        working-directory: packages/path_graph
        run: |
          dart pub get
          dart analyze --fatal-infos --fatal-warnings

      - name: Test path_graph package
        working-directory: packages/path_graph
        run: dart test -r github

      # Offline routing, points of interest and coordinates: pure Dart, each
      # with its own pubspec. Tests that need local routing data skip here.
      - name: Analyze and test traxroute, traxpoi and traxcoords
        run: |
          for p in traxroute traxpoi traxcoords; do
            (cd packages/$p && dart pub get && dart analyze --fatal-infos --fatal-warnings && dart test -r github) || exit 1
          done

      # The traxmap package (offline vector maps) is a Flutter package with
      # its own pubspec. Its real-pack tests skip here: the test packs aren't
      # in git (see packages/traxmap/README.md).
      - name: Analyze traxmap package
        working-directory: packages/traxmap
        run: |
          flutter pub get
          flutter analyze --fatal-infos --fatal-warnings

      - name: Test traxmap package
        working-directory: packages/traxmap
        run: flutter test -r github

  # Day-to-day development runs on a Raspberry Pi (Linux desktop) with no
  # Android SDK, so this is where the Android side gets built: plugin native
  # code (background_downloader needs Kotlin 2.1+) and the manifest.
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build debug APK
        run: flutter build apk --debug
